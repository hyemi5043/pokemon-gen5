async function gymTalk(g){const G=GYMS[g];const key=typeof G.leader==='function'?G.leader():G.leader;const L=TR[key];
 if(S.badges.includes(G.badge)){await say(L.name,L.after);return}
 for(const l of L.pre)await say(L.name,l);const ok=await trainerBattle(L);if(!ok)return;
 S.badges.push(G.badge);sfx('badge');await say(null,`${jo(S.name,'은','는')} ${L.name}에게서 ${jo(G.badge,'을','를')} 받았다!`);
 if(G.after)await G.after()}

 await talk('주박사','어서 와, {P}! 기다리고 있었어.','나는 주박사. 하나지방에서 포켓몬의 기원을 연구하고 있지.','요즘 하나지방의 하늘이 이상하다는 건 알지? 한낮에도 해가 회색으로 바래는 「회색 일식」…','일식이 짙어질수록 포켓몬들은 기운을 잃고, 다른 지방에서만 살던 포켓몬들까지 하나지방에서 목격되고 있어.','그래서 너희 셋에게 부탁할게. 포켓몬과 함께 하나지방을 여행하며, 이 현상의 「진실」을 너희 눈으로 확인해 줘.','이 도감은 하나지방뿐 아니라 전국의 포켓몬을 기록할 수 있게 개조했어. 자, 첫 파트너를 골라 보렴!');
 const names=['주리비얀','뚜꾸리','수댕이'];let i;

 const nx=RIFTS.findIndex((r,i)=>!has('G'+i));if(nx>=0)await say('주박사',`다음 균열은 「${RIFTS[nx].name}」. ${LOC[RIFTS[nx].at].n}에 있어.`);else await say('주박사','모든 균열이 진정됐어… 정말 고마워!')}
async function e2N(){if(has('e2N'))return;flag('e2N');keys.clear();
 await say(null,'균열 앞에 초록 머리의 청년이 서 있다. 낡았지만 단정한 옷차림… 어딘가 이 시대 사람 같지 않다.');
 await talk('N','…그 모자. 그 눈. 너, {F}의 아이구나.','놀라지 않아도 돼. 나는 N. 100년 전, 네 아버지와 함께 하늘의 회색을 걷어 낸 사람.','용과 함께 오래 여행하다 보니… 시간이 나를 조금 비켜 가 버렸어.','이 균열들은 그날의 상처야. 큐레무가 흑과 백을 삼키려 할 때 찢어진 시간이, 이제야 벌어지고 있어.','균열을 지키는 그림자들은 이 세계가 기억하는 강한 트레이너들의 모습을 하고 있어. 네 힘을 보여 주면 길을 열어 줄 거야.','마지막 균열은 자이언트홀. 그곳에서… 너를 기다리는 존재가 있어.')}
async function era2Ending(){if(has('e2clear'))return;keys.clear();
 await say(null,'균열이 고요히 닫혀 간다. 그 빛 속에서, 거대한 날개가 펼쳐졌다…');const id=S.ideal||643;const nm=id===643?'레시라무':'제크로무';
 await say(nm,`「…그 눈빛. 그대는 ${S.father}의 아이인가.」`);
 await say(nm,`「100년 전, 그와 나는 함께 진실과 이상을 지켰다. 그가 떠난 뒤 나는 돌이 되어 잠들었으나… 그대의 목소리가 나를 깨웠다.」`);
 await say(nm,'「이번에는 그대의 대답을 들려다오. 함께 가자, 새로운 영웅이여.」');
 await giveMon(id,75,`${jo(nm,'이','가')} ${S.name}의 동료가 되었다!`);
 await talk('N','…다행이다. 그 용이 다시 웃었어.','나도 이제 떠날게. 이번에는 정말 멀리. 네 아버지에게… 아니, 됐어. 언젠가 내가 직접 전할게.','고마워, {P}. 하나지방은 앞으로도 흑과 백, 그리고 그 사이의 모든 색으로 빛날 거야.');
 flag('e2clear');saveGame(true);
 await rollCredits(`하나 크로니클\n— 100년 후의 하나 —\n\n\n영웅의 아들\n${S.name}\n\n아버지\n${S.father}\n\n함께한 포켓몬\n${S.party.map(p=>p.name+' Lv.'+p.lv).join('\n')}\n\n\n진정시킨 균열\n${RIFTS.map(r=>r.name).join('\n')}\n\n\nN\n주박사 (5대)\n그리고 100년 전의 모든 사람들\n\n\n이 게임은 팬이 만든 비공식 리메이크입니다.\n포켓몬스터 관련 권리는 Nintendo · Creatures · GAME FREAK에 있습니다.\n\n\n— 끝 —\n\n(균열 속 전설의 포켓몬들은 계속 만날 수 있습니다)`);
 await warp('nuvema',{x:16,y:11,dir:'up'})}

 await say('감독','레디… 액션!');for(const l of[].concat(F.tr.pre||[]))await say(F.tr.name,l);
 if(!await trainerBattle(F.tr))return;flag('film'+n);await say('감독','컷! 오케이! 최고였어!');await F.prize()}

// -------- 타이틀 / 시작 --------
function newState(era,name){return{era,name,father:null,money:3000,party:[],box:[],bag:{},flags:{},badges:[],seen:{},caught:{},starter:null,ideal:null,pos:null,lastHeal:null,v:1}}
function resetWorld(){for(const k in MAPS)delete MAPS[k];M=null}
async function startGame(){$('#title').classList.remove('on');$('#hud').style.display='';MODE='map'}
async function newGame1(){const nm=await nameInput('주인공의 이름을 알려 주세요','레이');S=newState(1,nm);SLOT=1;resetWorld();await startGame();await warp('nuvema#0',{x:3,y:5,dir:'up'})}
async function newGame2(){const s1=loadSave(1);if(!s1||!s1.flags.champion){toast('1부를 클리어해야 시작할 수 있습니다');return}
 const nm=await nameInput(`영웅 ${s1.name}의 아들, 그의 이름은?`,'레오');S=newState(2,nm);SLOT=2;S.father=s1.name;S.ideal=s1.ideal||643;S.legacyMon=s1.legacy||null;
 S.seen=Object.assign({},s1.seen);S.caught=Object.assign({},s1.caught);S.money=5000;resetWorld();await startGame();await warp('nuvema',{x:15,y:12,dir:'right'})}
async function cont(n){const s=loadSave(n);if(!s)return;S=s;SLOT=n;resetWorld();await startGame();
 const ids=new Set([...S.party,...S.box].map(p=>p.sid));for(const p of[...S.party,...S.box]){if(!SP[p.sid])SP[p.sid]=finishSp({id:p.sid,name:p.name,types:p.types,base:p.base,evo:p.evo,capture:p.capture,bexp:p.bexp,legend:p.legend})}
 await warp(S.pos.map,S.pos)}
function showTitle(){MODE='title';S=null;resetWorld();$('#hud').style.display='none';hideDlg();hideSheet();$('#battle').className='';
 const s1=loadSave(1),s2=loadSave(2);const t=$('#title');
 const btn=[];if(s1)btn.push(['이어하기 — 1부 : 회색의 서약',`${s1.name} · 배지 ${s1.badges.length} · 도감 ${Object.keys(s1.caught).length}`,()=>cont(1)]);
 btn.push(['새로 시작 — 1부 : 회색의 서약',s1?'※ 기존 1부 저장 데이터를 덮어씁니다':'하나지방의 새로운 이야기',async()=>{if(s1){const y=await choose(['새로 시작한다 (덮어쓰기)','취소'],{cancel:true});if(y!==0)return}await newGame1()}]);
 if(s2)btn.push(['이어하기 — 2부 : 100년 후의 하나',`${s2.name} · 균열 ${Object.keys(s2.flags).filter(k=>/^G\d+$/.test(k)).length}/${RIFTS.length}`,()=>cont(2)]);
 btn.push(['새로 시작 — 2부 : 100년 후의 하나',s1&&s1.flags.champion?'1부 주인공의 아들이 떠나는 모험':'🔒 1부를 클리어하면 해금',async()=>{if(!(s1&&s1.flags.champion)){toast('1부 엔딩(챔피언 등극) 후 해금됩니다');return}if(s2){const y=await choose(['새로 시작한다 (덮어쓰기)','취소']);if(y!==0)return}await newGame2()}]);
 btn.push(['조작 방법','',async()=>{sheet(`<h3>조작 방법</h3><p>· 이동 : 방향키 / WASD (모바일은 화면 아래 패드)<br>· 결정·대화 : Z / Space / Enter / A버튼<br>· 취소·메뉴 : X / Esc / B버튼, 메뉴 : M 또는 화면 우측 상단 버튼<br>· 대화창·선택지는 마우스·터치로 눌러도 됩니다.</p><h3 style="margin-top:10px">게임 안내</h3><p>· 풀숲·동굴에서 야생 포켓몬이 등장합니다. 인터넷에 연결되어 있으면 1~9세대 전 포켓몬(1025종)이 등장하며, 오프라인에서는 내장 데이터의 포켓몬만 등장합니다.<br>· 포켓몬 그림 대신 타입 색 엠블럼과 이름으로 표시됩니다.<br>· 학습장치가 기본 적용되어 파티 전원이 경험치를 받습니다.<br>· 저장은 지역 이동 시 자동, 메뉴에서 수동 저장할 수 있습니다(브라우저 저장소).<br>· 1부 클리어 후 5세대 전설들이 각지에 나타나고, 2부(100년 후)가 해금됩니다. 2부에서는 시간의 균열에서 다른 세대 전설·환상 포켓몬을 만날 수 있습니다.</p>`,true);await choose(['닫기'],{top:true});hideSheet()}]);
 t.innerHTML=`<div class="logo"><div class="l1">POCKET MONSTERS · FAN REMAKE</div><div class="l2">하나 크로니클</div><div class="l3">BLACK · WHITE · GRAY</div></div><div class="btns">${btn.map((b,i)=>`<button data-i="${i}"><div>${b[0]}</div><div style="font-size:.7em;font-weight:400;opacity:.7">${b[1]}</div></button>`).join('')}</div><div class="foot">비공식 팬 메이드 게임 · 포켓몬 데이터: PokéAPI (온라인 시) · 포켓몬스터 © Nintendo / Creatures / GAME FREAK</div>`;
 t.classList.add('on');let sel=0;const bs=[...t.querySelectorAll('button')];const upd=()=>bs.forEach((b,i)=>b.classList.toggle('sel',i===sel));upd();
 const pop=pushH(async k=>{if(MODE!=='title'||!$('#title').classList.contains('on')){pop();return}if(k==='up'){sel=(sel-1+bs.length)%bs.length;upd();sfx('tick')}else if(k==='down'){sel=(sel+1)%bs.length;upd();sfx('tick')}else if(k==='A'){sfx('blip');go(sel)}});
 let going=false;async function go(i){if(going)return;going=true;const isHelp=i===btn.length-1;if(!isHelp)pop();
  try{await btn[i][2]()}finally{going=false;if(MODE==='title'&&isHelp){}else if(MODE==='title'&&!isHelp){showTitle()}}}
 bs.forEach((b,i)=>b.onclick=()=>{initAudio();sel=i;upd();go(i)})}
// -------- boot --------
function fit(){const touch=document.body.classList.contains('touch');const pad=touch?186:16;const w=Math.min(innerWidth-(touch?0:16),(innerHeight-pad)*480/352,1100);const g=$('#game');g.style.width=w+'px';g.style.height=(w*352/480)+'px';g.style.setProperty('--u',(w/480)+'px')}
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
addEventListener('resize',fit);fit();
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;const dir=['up','down','left','right'].includes(k);
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('dn');if(dir){keys.add(k);heldOrder=heldOrder.filter(x=>x!==k).concat(k)}press(k)});
 const up=e=>{b.classList.remove('dn');if(dir)keys.delete(k)};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
$('#hbMenu').onclick=()=>{initAudio();if(MODE==='map'&&!busy&&!handlers.length)run(openMenu)};
const updSnd=()=>{$('#hbSnd').textContent=SET.snd?'♪':'♪̸';$('#hbSnd').style.opacity=SET.snd?1:.5};updSnd();
$('#hbSnd').onclick=()=>{initAudio();SET.snd=!SET.snd;saveSet();updSnd()};
requestAnimationFrame(loop);showTitle();
